<!doctype html>
<html lang="zh-CN">
  <head>
    <!-- 
      meta charset: 设置字符编码为 UTF-8
      UTF-8 是一种通用的字符编码，支持中文等各种语言
      如果不设置，中文可能显示乱码
    -->
    <meta charset="UTF-8" />
    
    <!-- 
      link rel="icon": 设置网站图标
      favicon 是浏览器标签页上显示的小图标
    -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- 
      meta viewport: 设置响应式布局的关键配置
      width=device-width: 页面宽度等于设备宽度
      initial-scale=1.0: 初始缩放比例为 1（不缩放）
      这确保网站在手机上也能正常显示
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 
      title: 网站标题
      显示在浏览器标签页上，也是搜索引擎显示的标题
    -->
    <title>个人作品集 - 数字工匠</title>

    <!--
      Google Fonts 字体加载
      =====================
      使用独特的字体组合，避免通用的 AI 美学（如 Inter、Roboto）

      字体选择理念：
      - Syne: 几何风格的显示字体，现代且有个性，用于标题
      - DM Sans: 优雅的无衬线字体，清晰易读，用于正文
      - JetBrains Mono: 精致的等宽字体，用于代码和技术标签

      preconnect: 提前建立连接，加快字体加载速度
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  
  <body>
    <!-- 
      div id="root": React 应用的挂载点
      React 会把所有内容渲染到这个 div 里面
      这是 React 应用的"容器"
    -->
    <div id="root"></div>
    
    <!-- 
      script: 加载 JavaScript 入口文件
      type="module": 使用 ES Module 模块系统
      src="/src/main.tsx": 指向入口文件
      这是整个应用的启动点
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
